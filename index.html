<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pour Chery Thevena ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #12000a, #4b0018, #12000a);
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      color: #ffb6c1;
    }

    .heart {
      font-size: 60px;
      animation: heartbeat 1.5s infinite;
    }

    .message {
      max-width: 700px;
      font-size: 20px;
      line-height: 1.7;
      margin: 25px auto;
    }

    .music-box {
      margin-top: 25px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      width: min(90%, 500px);
    }

    .music-title {
      font-size: 18px;
      margin-bottom: 15px;
      color: #ffd6df;
    }

    audio {
      width: 100%;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      background: #ff4f81;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #ff2f69;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="heart">❤️</div>

    <h1>Joyeux Anniversaire Chery Thevena</h1>

    <div class="message">
      Gen kèk moun ou rankontre nan lavi a ki fè jou yo vin pi bèl.
      Ti paj sa a se jis yon fason pou m di ou jan ou espesyal pou mwen.
      Mwen swete jou sa pote anpil souri, anpil lanmou ak anpil bèl moman pou ou.
      ❤️
    </div>

    <div class="music-box">

      <div class="music-title">
        🎵 Une chanson pour toi
      </div>

      <audio id="birthdayMusic" controls>
        <source src="Avant Toi - VITAA & SLIMANE (Karaoké Piano Français).mp3" type="audio/mpeg">
        Navigatè ou a pa sipòte audio.
      </audio>

      <button onclick="toggleMusic()">
        ▶️ Play / ⏸️ Pause
      </button>

    </div>

  </div>

  <script>
    const music = document.getElementById("birthdayMusic");

    function toggleMusic() {
      if (music.paused) {
        music.play();
      } else {
        music.pause();
      }
    }
  </script>

</body>
</html>
